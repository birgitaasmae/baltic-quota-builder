<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baltic Quota Builder</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="toolbar" aria-label="Quota builder controls">
        <div>
          <p class="eyebrow">Separate Latvia and Lithuania workspace</p>
          <h1>Baltic Quota Builder</h1>
        </div>

        <label class="field">
          <span>Country</span>
          <select id="countrySelect">
            <option value="latvia">Latvia</option>
            <option value="lithuania">Lithuania</option>
          </select>
        </label>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div>
            <h2 id="countryName">Latvia</h2>
            <p id="sourceDescription">Official Statistics Portal API / PxWeb API.</p>
          </div>
          <a id="sourceLink" href="https://stat.gov.lv/en/api-un-kodu-vardnicas/api-v2" target="_blank" rel="noreferrer">Source API</a>
        </div>

        <div class="grid">
          <label class="field">
            <span>Year</span>
            <input id="yearInput" type="number" min="2000" max="2100" value="2025">
          </label>

          <label class="field">
            <span>Minimum Age</span>
            <input id="minAgeInput" type="number" min="0" max="120" value="18">
          </label>

          <label class="field">
            <span>Maximum Age</span>
            <input id="maxAgeInput" type="number" min="0" max="120" value="74">
          </label>
        </div>

        <fieldset class="dimensions">
          <legend>Quota Dimensions</legend>
          <label><input type="checkbox" checked> Age</label>
          <label><input type="checkbox" checked> Gender</label>
          <label><input type="checkbox"> Region</label>
          <label><input type="checkbox"> Education</label>
          <label><input type="checkbox"> Citizenship</label>
          <label><input type="checkbox"> Country of birth</label>
        </fieldset>

        <div class="actions">
          <button id="inspectButton" type="button">Inspect Data Source</button>
        </div>

        <pre id="output" class="output">Choose a country and inspect the data source.</pre>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
